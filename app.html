<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Example Dashboard | OpLev</title>
<meta name="description" content="An example of the dashboard OpLev builds into every engine, shown for a made-up business with sample data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@900&family=Geist:wght@300..600&family=Martian+Mono:wdth,wght@75..112.5,100..800&display=swap">
<style>
/* OpLev, Bison system. Ink ground, paper type, hairline rules, square corners.
   Layout: one column at 1360 max with hairline rules between sections. Grids use the 1px-gap hairline trick. */
:root{
  color-scheme:dark;
  --ink:#070708;--ink-2:#0E0E10;--paper:#F2F2EF;--paper-2:#E5E5E1;
  --soft:#B8B8BD;--dim:#8A8A90;--dim-2:#56565C;--line:#202024;--line-2:#36363C;
  --on-paper-dim:#5C5C61;--on-paper-line:#C7C7C2;
  --display:"Martian Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --body:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --num:"Doto","Martian Mono",ui-monospace,monospace;
  --gut:16px;--nav:62px;--max:1360px;
  --wipe:cubic-bezier(.77,0,.18,1);--strike:cubic-bezier(.7,0,.2,1);
}
@media (min-width:760px){:root{--gut:40px}}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ink);color:var(--paper);font:400 17px/1.55 var(--body);-webkit-font-smoothing:antialiased;overflow-x:clip}
[hidden]{display:none!important}
img{max-width:100%}
html.is-loading body,html.menu-open body{overflow:hidden}
::selection{background:var(--paper);color:var(--ink)}
.band ::selection{background:var(--ink);color:var(--paper)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ink)}
a{color:inherit}
:focus-visible{outline:2px solid currentColor;outline-offset:3px}
.wrap{width:100%;max-width:calc(var(--max) + 2*var(--gut));margin-inline:auto;padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px))}
section[id]{scroll-margin-top:var(--nav)}
.stack{display:flex;flex-direction:column;gap:28px}

/* type */
.label{font:400 11px/1.4 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0}
.eyebrow{display:flex;align-items:center;gap:10px;margin:0;font:400 12px/1 var(--display);letter-spacing:.02em;color:var(--dim)}
.eyebrow::before{content:"";width:6px;height:6px;background:var(--paper);flex:none}
.h1,.h2,.h3{font-family:var(--display);font-weight:500;font-stretch:87.5%;margin:0;color:var(--paper);text-wrap:balance}
.h1{font-size:clamp(32px,6vw,92px);line-height:1;letter-spacing:-.055em;max-width:16ch}
.h2{font-size:clamp(28px,4.4vw,62px);line-height:1.04;letter-spacing:-.045em;max-width:18ch}
.h3{font-size:clamp(18px,1.7vw,23px);line-height:1.2;letter-spacing:-.03em}
.lede{color:var(--soft);max-width:54ch;margin:0}
@keyframes blink{0%{opacity:1}50%{opacity:0}}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:10px;font:500 12px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;padding:15px 20px;border:1px solid var(--paper);background:var(--paper);color:var(--ink);text-decoration:none;cursor:pointer;border-radius:0;transition:background .18s,color .18s,border-color .18s;white-space:nowrap}
.btn:hover{background:transparent;color:var(--paper)}
.btn.ghost{background:transparent;color:var(--paper);border-color:var(--line-2)}
.btn.ghost:hover{border-color:var(--paper)}
.btn svg{width:14px;height:14px;flex:none;margin-left:auto}
.btn:has(svg){justify-content:space-between;gap:28px;min-width:15rem}
.btn-sm:has(svg),.btn-xs:has(svg){min-width:0;gap:10px}
.btn-sm{padding:11px 14px;font-size:11px}
.actions{display:flex;flex-wrap:wrap;gap:12px}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;height:var(--nav);background:rgba(7,7,8,.86);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav .wrap{height:100%;display:grid;grid-template-columns:1fr auto;align-items:center;gap:16px}
@media (min-width:1000px){.nav .wrap{grid-template-columns:1fr auto 1fr}}
.brand{display:inline-flex;align-items:center;gap:10px;font:500 13px/1 var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--paper);text-decoration:none;justify-self:start}
.mark{width:10px;height:10px;flex:none;display:block}
.links{display:none}
@media (min-width:1000px){.links{display:flex;gap:26px}}
.links a{font:400 11px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);text-decoration:none;padding:8px 0;transition:color .18s}
.links a:hover,.links a[aria-current="page"]{color:var(--paper)}
.nav-r{display:flex;align-items:center;gap:12px;justify-self:end}
.clock{font:400 11px/1 var(--display);letter-spacing:.14em;color:var(--dim);font-variant-numeric:tabular-nums;text-transform:uppercase;white-space:nowrap}
.clock .c{animation:blink 1.1s steps(1) infinite}
.nav .clock{display:none;margin-right:4px}
@media (min-width:520px){.nav .clock{display:inline}}
@media (max-width:419px){.nav-cta{display:none}}

/* phone menu */
.menu-btn{display:inline-flex;align-items:center;gap:9px;appearance:none;-webkit-appearance:none;background:transparent;border:1px solid var(--line-2);border-radius:0;color:var(--paper);font:500 11px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;padding:11px 12px;cursor:pointer;transition:border-color .18s}
.menu-btn:hover,.menu-btn[aria-expanded="true"]{border-color:var(--paper)}
.menu-btn .bars{width:12px;height:9px;position:relative;display:block;flex:none}
.menu-btn .bars::before,.menu-btn .bars::after{content:"";position:absolute;left:0;right:0;height:1px;background:currentColor;transition:transform .2s,top .2s,bottom .2s}
.menu-btn .bars::before{top:1px}
.menu-btn .bars::after{bottom:1px}
.menu-btn[aria-expanded="true"] .bars::before{top:4px;transform:rotate(45deg)}
.menu-btn[aria-expanded="true"] .bars::after{bottom:4px;transform:rotate(-45deg)}
@media (min-width:1000px){.menu-btn{display:none}}
.menu{position:fixed;left:0;right:0;bottom:0;top:calc(var(--nav) + env(safe-area-inset-top,0px));z-index:45;background:var(--ink);overflow-y:auto;overscroll-behavior:contain}
.menu .wrap{min-height:100%;display:flex;flex-direction:column;justify-content:space-between;gap:40px;padding-block:24px calc(28px + env(safe-area-inset-bottom,0px))}
.menu-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.menu-list a{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:baseline;gap:12px;padding:16px 0;border-bottom:1px solid var(--line);color:var(--paper);text-decoration:none;transition:background .18s}
.menu-list a:hover{background:var(--ink-2)}
.menu-list .mn{font:400 11px/1 var(--display);letter-spacing:.1em;color:var(--dim-2);font-variant-numeric:tabular-nums}
.menu-list .mt{font-family:var(--display);font-weight:500;font-stretch:87.5%;font-size:clamp(20px,5.4vw,26px);line-height:1.1;letter-spacing:-.03em}
.menu-list .mp{font:400 11px/1 var(--display);color:var(--dim-2);white-space:nowrap}
.menu-list a[aria-current="page"] .mn,.menu-list a[aria-current="page"] .mp{color:var(--paper)}
@media (max-width:379px){.menu-list .mp{display:none}}
.menu-foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 24px}
@media (min-width:1000px){.menu{display:none!important}}

/* hero (home) */
.hero{position:relative;overflow:hidden}
.field{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;-webkit-mask-image:linear-gradient(90deg,transparent 28%,#000 78%);mask-image:linear-gradient(90deg,transparent 28%,#000 78%)}
@media (max-width:759px){.field{-webkit-mask-image:linear-gradient(to bottom left,#000 0%,transparent 58%);mask-image:linear-gradient(to bottom left,#000 0%,transparent 58%)}}
.hero .wrap{position:relative;padding-block:clamp(48px,7vw,104px) clamp(28px,4vw,44px);display:flex;flex-direction:column;gap:28px}
.readout{position:absolute;top:22px;right:max(var(--gut),env(safe-area-inset-right,0px));color:var(--dim-2);font-variant-numeric:tabular-nums;display:none}
@media (min-width:760px){.readout{display:block}}
.hindex{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 14px;margin-top:clamp(16px,4vw,52px);padding-top:18px;border-top:1px solid var(--line);font:400 11px/1.5 var(--display);letter-spacing:.14em;text-transform:uppercase}
.hindex .lab{color:var(--dim-2)}
.hindex a{color:var(--soft);text-decoration:none;display:inline-flex;gap:8px;transition:color .18s}
.hindex a span{color:var(--dim-2)}
.hindex a:hover{color:var(--paper)}
.hindex i{font-style:normal;color:var(--dim-2)}

/* sections */
.sec{border-top:1px solid var(--line)}
.sec>.wrap{padding-block:clamp(84px,11vw,160px)}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:20px 40px;margin-bottom:clamp(36px,5vw,64px)}
.head-l{display:flex;flex-direction:column;gap:22px;min-width:0}
.top .wrap{padding-block:clamp(48px,7vw,104px) clamp(56px,7vw,96px);display:flex;flex-direction:column;gap:28px}

/* home work index + preview */
.work{display:grid;gap:1px;background:var(--line);border:1px solid var(--line)}
@media (min-width:980px){.work{grid-template-columns:minmax(0,5fr) minmax(0,8fr)}}
.cell{background:var(--ink);min-width:0}
.rows{display:flex;flex-direction:column}
.case-row{display:grid;grid-template-columns:34px 72px minmax(0,1fr) auto;grid-template-areas:"n th nm mt" "n th ln ln";gap:4px 14px;align-items:start;padding:20px clamp(16px,2vw,24px);border-bottom:1px solid var(--line);color:inherit;text-decoration:none;transition:background .18s}
.case-row:hover,.case-row.on{background:var(--ink-2)}
.case-row .n{grid-area:n;padding-top:8px;font:400 11px/1 var(--display);letter-spacing:.1em;color:var(--dim-2);display:inline-flex;align-items:center;gap:7px;font-variant-numeric:tabular-nums}
.case-row .n::before{content:"";width:6px;height:6px;background:transparent;flex:none}
.case-row.on .n{color:var(--paper)}
.case-row.on .n::before{background:var(--paper)}
.case-row .mini{grid-area:th;margin-top:3px}
.case-row .nm{grid-area:nm;min-width:0}
.case-row .mt{grid-area:mt;padding-top:7px;color:var(--dim-2);white-space:nowrap}
.case-row .ln{grid-area:ln;font-size:15px;line-height:1.45;color:var(--dim)}
.case-row:hover .mini,.case-row.on .mini{border-color:var(--dim)}
@media (max-width:520px){
  .case-row{grid-template-columns:28px 56px minmax(0,1fr);grid-template-areas:"n th nm" "n th ln";gap:4px 12px}
  .case-row .n::before{display:none}
  .case-row .mt{display:none}
  .case-row .mini{width:56px}
}
.preview-cell{display:none}
@media (min-width:980px){.preview-cell{display:block}}
.preview{position:sticky;top:calc(var(--nav) + env(safe-area-inset-top,0px));padding:clamp(20px,3.2vw,44px);display:flex;flex-direction:column;gap:24px}
.pv-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.pv-body{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.pv-name{font-size:clamp(28px,3.2vw,46px);line-height:1.02;letter-spacing:-.05em}
.pv-sum{margin:0 0 6px;color:var(--soft);font-size:16px;max-width:58ch}

/* thumbnails */
.mini{position:relative;display:block;width:72px;max-width:100%;aspect-ratio:16/9;background:var(--ink-2);border:1px solid var(--line-2);overflow:hidden;transition:border-color .18s;flex:none}
.mini canvas,.mini img{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover}
.thumb{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;margin:0;background:var(--ink-2);border:1px solid var(--line-2);overflow:hidden;transition:border-color .18s}
.thumb canvas,.thumb img{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover}
.thumb .tag{position:absolute;background:var(--ink);padding:5px 7px;color:var(--dim);font-variant-numeric:tabular-nums}
.thumb .tag.tl{top:12px;left:12px}
.thumb .tag.br{bottom:12px;right:12px}
.thumb .tk{position:absolute;width:12px;height:12px;border:0 solid var(--soft)}
.thumb .tk.a{top:0;left:0;border-top-width:1px;border-left-width:1px}
.thumb .tk.b{top:0;right:0;border-top-width:1px;border-right-width:1px}
.thumb .tk.c{bottom:0;left:0;border-bottom-width:1px;border-left-width:1px}
.thumb .tk.d{bottom:0;right:0;border-bottom-width:1px;border-right-width:1px}

/* work page cards */
.cards{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);grid-template-columns:minmax(0,1fr);margin-top:clamp(20px,3vw,36px)}
@media (min-width:760px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1200px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{background:var(--ink);color:inherit;text-decoration:none;display:flex;flex-direction:column;gap:20px;padding:clamp(16px,1.8vw,24px);min-width:0;transition:background .18s}
.card:hover{background:var(--ink-2)}
.card:hover .thumb{border-color:var(--dim)}
.card-b{display:flex;flex-direction:column;gap:10px;flex:1}
.card-top{display:flex;justify-content:space-between;gap:12px}
.card-name{font-size:clamp(22px,2.2vw,30px);line-height:1.08;letter-spacing:-.045em}
.card-line{margin:0;color:var(--soft);font-size:16px}
.card-foot{margin-top:auto;padding-top:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--line)}
.card-foot .go{display:inline-flex;align-items:center;gap:8px;transition:color .18s}
.card-foot svg{width:14px;height:14px}
.card:hover .card-foot .go{color:var(--paper)}

/* case page */
.crumbs{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.crumbs a{display:inline-flex;align-items:center;gap:8px;text-decoration:none;transition:color .18s}
.crumbs a:hover{color:var(--paper)}
.crumbs svg{width:14px;height:14px}
.facts{margin:0;display:grid;gap:1px;background:var(--line);border:1px solid var(--line);grid-template-columns:minmax(0,1fr)}
@media (min-width:760px){.facts{grid-template-columns:repeat(3,minmax(0,1fr))}}
.facts div{background:var(--ink);padding:16px 18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.facts dd{margin:0;font:400 14px/1.45 var(--display);color:var(--paper)}
.split{display:grid;gap:36px}
@media (min-width:980px){.split{grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:64px}}
.split-r{display:flex;flex-direction:column;gap:28px;min-width:0}
.check{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.ck{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:16px 0;border-bottom:1px solid var(--line);font-size:16px;line-height:1.45}
.ck .b{font:400 12px/1.45 var(--display);color:var(--dim);white-space:pre}
.ck .txw{min-width:0}
.ck .tx{color:var(--paper)}
.ck .by{text-align:right;white-space:nowrap;color:var(--dim-2);transition:color .4s}
.ck.done .b{color:var(--paper)}
.ck .b{transition:color .3s}
.ck.done .by{color:var(--soft)}
.built{list-style:none;margin:0;padding:0;display:grid;gap:1px;background:var(--line);border:1px solid var(--line);grid-template-columns:minmax(0,1fr)}
@media (min-width:760px){.built{grid-template-columns:repeat(2,minmax(0,1fr))}}
.built li{background:var(--ink);padding:clamp(22px,2.6vw,36px);display:flex;flex-direction:column;gap:12px;transition:background .18s}
.built li:hover{background:var(--ink-2)}
.built .kind{display:inline-flex;align-items:center;gap:8px}
.built .kind::before{content:"";width:6px;height:6px;background:var(--paper);flex:none}
.built .kind.agent::before{background:transparent;border:1px solid var(--paper)}
.built .kind.tool::before{background:linear-gradient(90deg,var(--paper) 50%,transparent 50%);border:1px solid var(--paper)}
@media (min-width:760px){.built li:last-child:nth-child(odd){grid-column:1 / -1}}
@media (min-width:760px){.facts.f4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1100px){.facts.f4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.case-note{color:var(--dim-2);max-width:80ch;text-transform:none;letter-spacing:.02em}
@media (max-width:520px){.ck{grid-template-columns:auto minmax(0,1fr)}.ck .by{grid-column:2;text-align:left;white-space:normal}}
.built p{margin:0;color:var(--soft);font-size:16px;max-width:52ch}
.results{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);grid-template-columns:minmax(0,1fr)}
@media (min-width:760px){.results{grid-template-columns:repeat(3,minmax(0,1fr))}}
.rcell{background:var(--ink);padding:clamp(22px,2.6vw,36px);display:flex;flex-direction:column;gap:14px}
.rcell-v{font-family:var(--display);font-weight:500;font-stretch:87.5%;font-size:clamp(36px,4.2vw,64px);line-height:1;letter-spacing:-.05em;color:var(--paper)}
.rcell.todo .rcell-v{color:var(--dim-2)}
.pager{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);grid-template-columns:minmax(0,1fr)}
@media (min-width:760px){.pager{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pg{background:var(--ink);padding:clamp(20px,2.4vw,32px);display:flex;flex-direction:column;gap:16px;text-decoration:none;color:inherit;transition:background .18s;min-width:0}
.pg:hover{background:var(--ink-2)}
.pg .label{display:inline-flex;align-items:center;gap:8px}
.pg .label svg{width:14px;height:14px}
.pg-row{display:flex;align-items:center;gap:16px;min-width:0}
.pg .mini{width:96px}
.pg:hover .mini{border-color:var(--dim)}
@media (min-width:760px){.pg.next{align-items:flex-end;text-align:right}.pg.next .pg-row{flex-direction:row-reverse}}

/* log pane */
.pane{background:var(--ink-2);border:1px solid var(--line-2);font:400 12px/1.5 var(--display);min-width:0;max-width:980px}
.pane-hd{display:flex;align-items:center;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line-2)}
.sq{width:9px;height:9px;border:1px solid var(--dim-2);flex:none}
.pane-title{margin-left:8px;color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.pane-bd{padding:16px 14px 18px;min-height:330px}
.cmd{color:var(--paper);margin-bottom:12px;overflow-wrap:anywhere}
.cmd .pr{color:var(--dim-2);margin-right:10px}
.caret{display:inline-block;width:.62em;height:1.15em;background:var(--paper);vertical-align:-.22em;margin-left:2px;animation:blink 1.1s steps(1) infinite}
.row{display:grid;grid-template-columns:68px 96px minmax(0,1fr) auto;gap:12px;padding:5px 0;align-items:baseline;animation:rise .25s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.row .ts{color:var(--dim-2);font-variant-numeric:tabular-nums}
.row .ac{color:var(--dim);white-space:nowrap;justify-self:start}
.row .ac.need{background:var(--paper);color:var(--ink);padding:0 6px}
.row .ac.me{color:var(--paper);font-weight:700}
.row .msg{color:var(--paper);min-width:0}
.row .res{color:var(--paper);text-align:right;white-space:nowrap}
.row.wait .msg{color:var(--dim)}
.end{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line-2);display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;animation:rise .25s ease-out both}
.chip{background:var(--paper);color:var(--ink);padding:1px 6px}
.end .s{color:var(--dim)}
.pane-ft{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line-2)}
.dot{width:7px;height:7px;background:var(--dim-2);flex:none}
.pane[data-state="running"] .dot{background:var(--paper);animation:blink 1.1s steps(1) infinite}
.pane[data-state="waiting"] .dot{background:var(--paper);animation:blink .35s steps(1) infinite}
.pane[data-state="complete"] .dot{background:var(--paper)}
.replay{margin-left:auto;appearance:none;-webkit-appearance:none;background:transparent;border:1px solid var(--line-2);border-radius:0;color:var(--soft);font:400 10px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;padding:8px 10px;cursor:pointer;transition:border-color .18s,color .18s}

@media (max-width:759px){
  .row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"ac res" "msg msg";gap:2px 12px;padding:8px 0;border-bottom:1px solid var(--line)}
  .row .ts{display:none}

}

/* ticker */
.ticker{border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden;padding-block:16px;font:400 12px/1 var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}

.tk-set i{font-style:normal;color:var(--dim-2)}
@keyframes tick{to{transform:translateX(-50%)}}
.ticker + .sec{border-top:0}

/* method steps + pixel icons */
.steps{list-style:none;margin:0;padding:0;display:grid;gap:1px;background:var(--line);border:1px solid var(--line);grid-template-columns:minmax(0,1fr)}
@media (min-width:700px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1100px){.steps{grid-template-columns:repeat(4,minmax(0,1fr))}}
.step{background:var(--ink);padding:clamp(22px,2.6vw,36px);display:flex;flex-direction:column;gap:14px;transition:background .18s}
.step:hover{background:var(--ink-2)}
.step-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:clamp(16px,4vw,56px)}
.step .num{font:900 clamp(52px,5.4vw,80px)/.85 var(--num);color:var(--paper);font-variant-numeric:tabular-nums}
.step p{margin:0;color:var(--soft);font-size:16px}
.offer{list-style:none;margin:0;padding:0;display:grid;gap:1px;background:var(--line);border:1px solid var(--line);grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.offer{grid-template-columns:repeat(3,minmax(0,1fr))}}
.svc{background:var(--ink);padding:clamp(22px,2.6vw,36px);display:flex;flex-direction:column;gap:14px;transition:background .18s}
.svc:hover{background:var(--ink-2)}
.svc .px{margin-bottom:clamp(12px,3vw,40px)}
.svc p{margin:0;color:var(--soft);font-size:16px;max-width:46ch}
.svc:hover .px rect:not(.on){fill:var(--line-2)}
.px{width:50px;height:50px;flex:none;display:block;shape-rendering:crispEdges}
.px rect{fill:var(--line);transition:fill .12s}
.px rect.on{fill:var(--paper)}
.step:hover .px rect:not(.on){fill:var(--line-2)}

/* inverted band */
.band{background:var(--paper);color:var(--ink);border-top:0}
.band .eyebrow{color:var(--on-paper-dim)}
.band .eyebrow::before{background:var(--ink)}
.band .h2,.band .h3{color:var(--ink)}
.band .label{color:var(--on-paper-dim)}
.band .btn{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.band .btn:hover{background:transparent;color:var(--ink)}
.terms{border-top:1px solid var(--on-paper-line)}
.term{display:grid;gap:8px 40px;padding:clamp(20px,2.4vw,30px) 0;border-bottom:1px solid var(--on-paper-line)}
@media (min-width:760px){.term{grid-template-columns:minmax(0,5fr) minmax(0,7fr);align-items:baseline}}
.term p{margin:0;color:var(--on-paper-dim);max-width:56ch}

/* pricing */
.plans{display:grid;gap:1px;background:var(--on-paper-line);border:1px solid var(--on-paper-line);grid-template-columns:minmax(0,1fr)}
@media (min-width:980px){.plans{grid-template-columns:repeat(3,minmax(0,1fr))}}
.plan{background:var(--paper);padding:clamp(22px,2.6vw,36px);display:flex;flex-direction:column;gap:22px;min-width:0;transition:background .18s}
.plan:hover{background:var(--paper-2)}
.plan-id{display:flex;flex-direction:column;gap:16px}
.price{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin:0;font-family:var(--display);font-weight:500;font-stretch:87.5%;color:var(--ink)}
.price .amt{font-size:clamp(52px,5.8vw,88px);line-height:.92;letter-spacing:-.055em;font-variant-numeric:tabular-nums}
.price .per{font:400 12px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--on-paper-dim)}
.plan .for{margin:0;color:var(--on-paper-dim);font-size:16px}
@media (min-width:980px){.plan .for{min-height:3.1em}}
.inc{list-style:none;margin:0;padding:0;border-top:1px solid var(--on-paper-line);flex:1}
.inc li{display:grid;grid-template-columns:6px minmax(0,1fr);gap:14px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--on-paper-line);font-size:15px;line-height:1.45;color:var(--ink)}
.inc li::before{content:"";width:6px;height:6px;background:var(--ink);transform:translateY(-1px)}
.plan .btn{align-self:stretch}
.fine{margin-top:22px;display:flex;flex-wrap:wrap;gap:8px 24px}
.lic{grid-column:1 / -1;background:var(--ink);color:var(--paper);padding:clamp(22px,2.6vw,36px);display:grid;gap:24px 48px;align-items:end}
@media (min-width:980px){.lic{grid-template-columns:minmax(0,7fr) minmax(0,5fr)}}
.lic-l{display:flex;flex-direction:column;gap:16px;min-width:0}
.lic-l p{margin:0;color:var(--soft);font-size:16px;max-width:52ch}
.lic-r{display:flex;flex-direction:column;gap:20px;align-items:flex-start;min-width:0}
@media (min-width:980px){.lic-r{align-items:flex-end}}
.band .lic .h3,.lic .price{color:var(--paper)}
.band .lic .label,.lic .price .per{color:var(--dim)}
.lic .price .amt{font-size:clamp(40px,4.4vw,64px)}
.band .lic .btn{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.band .lic .btn:hover{background:transparent;color:var(--paper)}
.band .lic ::selection{background:var(--paper);color:var(--ink)}
.every{display:grid;column-gap:40px;border-top:1px solid var(--line)}
@media (min-width:760px){.every{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ev{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;padding:22px 0;border-bottom:1px solid var(--line);align-items:baseline}
.ev .b{font:400 12px/1 var(--display);color:var(--paper)}
.ev p{grid-column:2;margin:0;color:var(--soft);font-size:16px}
.qa{display:grid;gap:40px}
@media (min-width:980px){.qa{grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:64px}.qa .head{position:sticky;top:calc(var(--nav) + 32px);align-self:start;margin:0}}
.faq{border-top:1px solid var(--line)}

.faq summary:hover .h3,.faq details[open] .h3{color:var(--paper)}
.faq .a{margin:0;padding:0 0 26px;color:var(--soft);max-width:60ch}

/* contact */
.mail{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;margin-top:12px;padding-top:28px;border-top:1px solid var(--line)}
.addr{font:500 clamp(20px,3vw,40px)/1.1 var(--display);font-stretch:87.5%;letter-spacing:-.04em;color:var(--paper);-webkit-user-select:all;user-select:all;overflow-wrap:anywhere;min-width:0}

/* footer */
.foot{border-top:1px solid var(--line)}
.foot .wrap{padding-block:clamp(48px,7vw,96px) 28px}
.wm{font:900 26vw/.8 var(--num);letter-spacing:0;color:var(--paper);white-space:nowrap;overflow-x:clip;margin:0 0 clamp(28px,4vw,48px)}
.wm span{display:inline-block}
.frow{display:flex;flex-wrap:wrap;gap:12px 28px;justify-content:space-between;padding-top:18px;border-top:1px solid var(--line)}

/* loader */
.loader{display:none;position:fixed;inset:0;z-index:100;background:var(--ink);flex-direction:column;justify-content:space-between;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px));-webkit-clip-path:inset(0 0 0 0);clip-path:inset(0 0 0 0);transition:clip-path .85s var(--wipe),-webkit-clip-path .85s var(--wipe)}

.loader.gone{-webkit-clip-path:inset(0 0 100% 0);clip-path:inset(0 0 100% 0)}
.ld-top{display:flex;justify-content:space-between;align-items:center;gap:16px}
.ld-bot{display:flex;flex-direction:column;gap:16px}
.ld-row{display:flex;justify-content:space-between;align-items:flex-end;gap:24px}
.ld-log{margin:0;font:400 12px/1.7 var(--display);color:var(--dim);white-space:pre;min-height:calc(8 * 1.7em)}
.ld-log b{font-weight:400;color:var(--paper)}
.ld-n{font:900 clamp(96px,21vw,290px)/.8 var(--num);color:var(--paper);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ld-track{height:1px;background:var(--line-2);position:relative;overflow:hidden}
.ld-fill{position:absolute;inset:0;background:var(--paper);transform-origin:0 50%;transform:scaleX(0)}
@media (max-width:600px){.ld-row{flex-direction:column;align-items:stretch}.ld-n{align-self:flex-end}}

/* sound familiar */
.pains .ck .tx{font-family:var(--display);font-stretch:87.5%;font-size:clamp(16px,1.5vw,20px);letter-spacing:-.02em;line-height:1.35}
.pains .ck.done .by::before{content:"fixed by "}
.pains .ck .by{min-height:1em}

/* built for picker */
.picker{display:flex;flex-direction:column}
.tabs{display:flex;gap:1px;background:var(--line);border:1px solid var(--line);overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
@media (max-width:699px){.tabs{flex-wrap:wrap;overflow:visible}.tab{flex:1 1 calc(50% - 1px);justify-content:flex-start;white-space:normal;text-align:left;line-height:1.3}}
.tab{flex:1 0 auto;appearance:none;-webkit-appearance:none;border:0;border-radius:0;background:var(--ink);color:var(--dim);font:400 11px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;padding:18px 20px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:background .18s,color .18s}
.tab::before{content:"";width:6px;height:6px;border:1px solid currentColor;flex:none}
.tab:hover{background:var(--ink-2);color:var(--paper)}
.tab[aria-selected="true"]{background:var(--paper);color:var(--ink)}
.tab[aria-selected="true"]::before{background:var(--ink);border-color:var(--ink)}
.fpanel{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-top:0}
@media (min-width:900px){.fpanel{grid-template-columns:minmax(0,7fr) minmax(0,5fr)}}
.fp-l,.fp-r{background:var(--ink);padding:clamp(22px,2.6vw,40px);display:flex;flex-direction:column;gap:18px;min-width:0}
.fp-name{font-size:clamp(24px,2.6vw,38px);line-height:1.05;letter-spacing:-.045em}
.fp-pitch{margin:0;color:var(--soft);max-width:48ch}
.rowlist{list-style:none;margin:6px 0 0;padding:0;border-top:1px solid var(--line)}
.rowlist li{display:grid;grid-template-columns:6px minmax(0,1fr);gap:14px;align-items:baseline;padding:14px 0;border-bottom:1px solid var(--line);color:var(--paper);font-size:16px;line-height:1.45}
.rowlist li::before{content:"";width:6px;height:6px;background:var(--paper);transform:translateY(-2px)}
.seen{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line)}
.seen a{display:flex;align-items:center;gap:14px;padding:14px;background:var(--ink);text-decoration:none;color:var(--paper);transition:background .18s;min-width:0}
.seen a:hover{background:var(--ink-2)}
.seen a:hover .mini{border-color:var(--dim)}
.seen .h3{font-size:clamp(16px,1.4vw,19px);min-width:0}
.go{display:inline-flex;margin-left:auto;color:var(--dim);transition:color .18s}
.go svg{width:14px;height:14px}
a:hover>.go{color:var(--paper)}
.fp-r .btn{align-self:flex-start;margin-top:auto}

/* run / grow / sell */
.band .lede{color:var(--on-paper-dim)}
.model{list-style:none;margin:0;padding:0;display:grid;gap:1px;background:var(--on-paper-line);border:1px solid var(--on-paper-line);grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.model{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mcell{background:var(--paper);padding:clamp(22px,2.6vw,40px);display:flex;flex-direction:column;gap:14px;transition:background .18s}
.mcell:hover{background:var(--paper-2)}
.mcell .num{font:900 clamp(52px,5.4vw,80px)/.85 var(--num);color:var(--ink);font-variant-numeric:tabular-nums;margin-bottom:clamp(14px,3vw,44px)}
.mcell .h3{font-size:clamp(22px,2.2vw,30px);letter-spacing:-.045em}

.kicker{margin-top:clamp(28px,4vw,48px);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:20px 40px}
.kicker-t{margin:0;font-family:var(--display);font-weight:500;font-stretch:87.5%;font-size:clamp(22px,2.8vw,40px);letter-spacing:-.045em;line-height:1.08;color:var(--ink);max-width:22ch;text-wrap:balance}
.band .btn.ghost{background:transparent;color:var(--ink);border-color:var(--on-paper-line)}
.band .btn.ghost:hover{border-color:var(--ink)}
.model-row{margin-top:8px}
@media (min-width:900px){.every.model-row{grid-template-columns:repeat(3,minmax(0,1fr))}}
.every.one-col{grid-template-columns:minmax(0,1fr)}

/* compare */
.cmp{border-top:1px solid var(--line)}
.cmp-row{display:grid;grid-template-columns:minmax(0,1.3fr) repeat(3,minmax(0,1fr));column-gap:24px;border-bottom:1px solid var(--line)}

.example:hover{background:var(--ink-2);border-color:var(--dim)}

.ex-b{display:flex;flex-direction:column;gap:6px;min-width:0}
.ex-t{color:var(--soft);font-size:15px;line-height:1.45}

/* inquiry */
.inq-page>.wrap{padding-block:clamp(48px,7vw,104px) clamp(84px,11vw,160px)}
.inq-wrap{display:grid;gap:48px}
@media (min-width:980px){.inq-wrap{grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:64px}.inq-side{position:sticky;top:calc(var(--nav) + 32px);align-self:start}}
.inq-side{display:flex;flex-direction:column;gap:24px;min-width:0}
.sel{color:var(--paper);-webkit-user-select:all;user-select:all;text-transform:none;letter-spacing:.02em}
.inq{position:relative;background:var(--ink-2);border:1px solid var(--line-2);padding:clamp(18px,2.6vw,36px);display:flex;flex-direction:column;gap:24px;min-width:0}
.inq-hd{display:flex;align-items:center;gap:6px;padding-bottom:16px;border-bottom:1px solid var(--line-2)}
.inq-grid{display:grid;gap:22px}
@media (min-width:640px){.inq-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fl{display:flex;flex-direction:column;gap:9px;min-width:0}
.inp{display:block;width:100%;appearance:none;-webkit-appearance:none;background:var(--ink);border:1px solid var(--line-2);border-radius:0;color:var(--paper);font:400 16px/1.45 var(--body);padding:13px 14px;transition:border-color .18s}
.inp:hover{border-color:var(--dim-2)}

.inp::placeholder{color:var(--dim-2)}
textarea.inp{min-height:132px;resize:vertical}
.fl.bad .label{color:var(--paper)}
.fl.bad .label::after{content:" / " attr(data-err)}
.fl.bad .inp{border-color:var(--paper)}
.fs{border:0;margin:0;padding:0;min-width:0}
.fs legend{padding:0;margin:0 0 12px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative;display:inline-flex;cursor:pointer}
.opt input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.opt span{display:inline-flex;align-items:center;gap:9px;padding:10px 12px;border:1px solid var(--line-2);background:var(--ink);color:var(--soft);font:400 12px/1.2 var(--display);letter-spacing:.03em;transition:border-color .15s,color .15s,background .15s}
.opt span::before{content:"";width:7px;height:7px;border:1px solid currentColor;flex:none}

.opt input:checked+span::before{background:var(--ink);border-color:var(--ink)}
.opt input:focus-visible+span{outline:2px solid var(--paper);outline-offset:3px}
.hp{position:absolute;left:-10000px;top:auto;width:1px;height:1px;overflow:hidden}
.inq-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 20px;padding-top:20px;border-top:1px solid var(--line-2)}
.inq .btn[disabled]{opacity:.55;cursor:progress}
.inq-status{font:400 12px/1.7 var(--display);color:var(--dim);background:var(--ink);border:1px solid var(--line-2);padding:14px;overflow-wrap:anywhere}

.eng-seen a{font:400 12px/1.4 var(--display);color:var(--soft);text-decoration:none;border-bottom:1px solid var(--line-2);transition:color .18s,border-color .18s}
.eng-seen a:hover{color:var(--paper);border-color:var(--paper)}

/* engine tags */

/* marketplace teaser: an index list that inverts on hover */

/* pricing model: a poster of three big words */
.poster-hd{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:clamp(20px,3vw,36px)}

/* method: a connected track instead of boxes */

  .track{grid-template-columns:repeat(4,minmax(0,1fr));column-gap:32px}

}

/* OpLev Console. Same Bison tokens as the site (site.css loads first).

.ws-btn{appearance:none;-webkit-appearance:none;width:100%;display:flex;align-items:center;gap:10px;background:var(--ink-2);border:1px solid var(--line-2);border-radius:0;color:var(--paper);padding:10px 12px;cursor:pointer;text-align:left;transition:border-color .18s}

.ws-opt{appearance:none;-webkit-appearance:none;width:100%;display:flex;justify-content:space-between;gap:10px;background:transparent;border:0;color:var(--soft);font:400 12px/1.3 var(--display);padding:9px 12px;text-align:left;cursor:pointer}

.side-nav{padding:10px 0 16px;flex:1}

.nav-i{display:flex;align-items:center;gap:10px;padding:8px 16px;color:var(--soft);text-decoration:none;font:400 13px/1.2 var(--body);border-left:2px solid transparent;transition:background .15s,color .15s}
.nav-i:hover{background:var(--ink-2);color:var(--paper)}

.nav-i .ni-r{margin-left:auto;font:400 10px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--dim-2)}
.badge{margin-left:auto;min-width:20px;height:18px;padding:0 6px;display:inline-grid;place-items:center;background:var(--paper);color:var(--ink);font:500 11px/1 var(--display)}

.side-foot{padding:14px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}

.side-foot a:hover{color:var(--paper)}
.lic-mini{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.lic-mini b{font:500 13px/1.2 var(--display);font-stretch:87.5%;color:var(--paper)}
.scrim{display:none}
@media (max-width:899px){
  .app{grid-template-columns:minmax(0,1fr)}

@media (max-width:899px){.side-btn{display:inline-flex}}

/* view */
.view{padding:clamp(20px,3vw,40px) clamp(16px,3vw,40px) 96px;max-width:1440px;display:flex;flex-direction:column;gap:clamp(20px,2.4vw,28px)}
.v-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px 32px}
.v-head-l{display:flex;flex-direction:column;gap:12px;min-width:0}
.v-title{margin:0;font-family:var(--display);font-weight:500;font-stretch:87.5%;font-size:clamp(28px,3.6vw,48px);line-height:1.02;letter-spacing:-.05em;color:var(--paper);text-wrap:balance}
.v-title.ec{color:var(--e)}

/* cards + grids */
.g{display:grid;gap:1px;background:var(--line);border:1px solid var(--line)}
.g>*{background:var(--ink);min-width:0}
.g2{grid-template-columns:minmax(0,1fr)}
.g3,.g4{grid-template-columns:minmax(0,1fr)}

@media (min-width:1100px){.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.cell{padding:clamp(16px,1.8vw,24px);display:flex;flex-direction:column;gap:12px}
a.cell{color:inherit;text-decoration:none;transition:background .18s}
a.cell:hover{background:var(--ink-2)}
.pnl{border:1px solid var(--line);background:var(--ink);min-width:0}

.pnl-hd a:hover{color:var(--paper)}
.pnl-bd{padding:16px}

@media (min-width:1100px){.ov-top{grid-template-columns:minmax(0,1.3fr) repeat(3,minmax(0,1fr))}}
@media (min-width:700px) and (max-width:1099px){.ov-top{grid-template-columns:repeat(2,minmax(0,1fr))}}
.big-n{font:900 clamp(56px,6vw,88px)/.85 var(--num);color:var(--paper);font-variant-numeric:tabular-nums}

.etile{border-top:1px solid var(--e)!important}
.etile.locked{border-top-color:var(--line-2)!important}
.et-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.et-top .label:first-child{color:var(--e)}
.state{display:inline-flex;align-items:center;gap:7px;font:400 10px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.state::before{content:"";width:7px;height:7px;background:var(--dim-2)}
.state.on{color:var(--paper)}
.state.on::before{background:var(--e,var(--agents));animation:blink 1.1s steps(1) infinite}
.state.lock::before{background:transparent;border:1px solid var(--dim-2)}
.et-name{font-family:var(--display);font-weight:500;font-stretch:87.5%;font-size:clamp(30px,2.8vw,40px);line-height:1;letter-spacing:-.05em;color:var(--paper)}

.etile.locked .bars i{background:var(--line-2)}
.kpi b{font:500 clamp(26px,2.4vw,34px)/1 var(--display);font-stretch:87.5%;letter-spacing:-.04em;color:var(--paper);font-variant-numeric:tabular-nums}
.kpi .label:last-child{color:var(--dim-2)}
.ov-bottom{display:grid;gap:clamp(20px,2.4vw,28px);grid-template-columns:minmax(0,1fr)}
@media (min-width:1100px){.ov-bottom{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}}
.feed{padding:6px 16px 12px;font:400 12px/1.5 var(--display);max-height:520px;overflow-y:auto}
.feed .row{border-bottom:1px solid var(--line)}
.feed .row:last-child{border-bottom:0}
.feed-empty{padding:28px 0;color:var(--dim);text-align:center}
.score-card{padding:16px;display:flex;flex-direction:column;gap:14px}

.trend i{flex:1;background:var(--line-2)}
.trend i:last-child{background:var(--paper)}

/* buttons + controls */
.btn-xs{padding:8px 10px;font-size:10px;letter-spacing:.12em}
.lnk{appearance:none;-webkit-appearance:none;background:none;border:0;padding:0;color:var(--soft);font:400 11px/1.4 var(--display);letter-spacing:.12em;text-transform:uppercase;cursor:pointer;text-decoration:none}

.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.toolbar .tabs{flex:1 1 auto;min-width:0}
.search{min-width:0;flex:0 1 260px}

/* approvals */
.ap-wrap{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);grid-template-columns:minmax(0,1fr)}

.tbl td.n{color:var(--paper);font-weight:500}
.tbl td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr.click{cursor:pointer;transition:background .15s}
.tbl tr.click:hover{background:var(--ink-2)}
.tbl tr.off td{color:var(--dim-2)}
.tbl tr.off td.n{color:var(--dim)}
.pt-title{display:flex;flex-direction:column;gap:3px;min-width:200px}
.pt-title b{font-weight:500;color:var(--paper)}
.pt-title span{font-size:13px;color:var(--dim)}
.st-chip{display:inline-flex;align-items:center;gap:6px;font:400 10px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line-2);color:var(--soft);padding:5px 7px;white-space:nowrap}
.st-chip.s-New{color:var(--paper);border-color:var(--paper)}
.st-chip.s-Won{background:var(--agents);border-color:var(--agents);color:var(--ink)}
.st-chip.s-Lost{color:var(--dim-2)}
.stages{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:700px){.stages{grid-template-columns:repeat(5,minmax(0,1fr))}}
.stage{appearance:none;-webkit-appearance:none;border:0;border-radius:0;text-align:left;cursor:pointer;color:inherit;font:inherit;padding:14px 16px;display:flex;flex-direction:column;gap:8px;transition:background .15s}
.stage:hover{background:var(--ink-2)}
.stage[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.stage[aria-pressed="true"] .label{color:var(--on-paper-dim)}
.stage b{font:500 22px/1 var(--display);font-stretch:87.5%;font-variant-numeric:tabular-nums}

/* engine detail */
.eh-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:14px 16px;border:1px solid var(--line);border-top:1px solid var(--e)}
.eh-row .state{margin-right:auto}
.lock-card{border:1px solid var(--line-2);background:var(--ink-2);padding:clamp(20px,3vw,40px);display:grid;gap:24px}
@media (min-width:900px){.lock-card{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.lock-card h2{margin:0;font-family:var(--display);font-weight:500;font-stretch:87.5%;font-size:clamp(24px,2.4vw,34px);letter-spacing:-.045em;color:var(--paper)}
.lock-card p{margin:0;color:var(--soft)}

/* plays library */
.plib{list-style:none;margin:0;padding:0;display:grid;border-left:1px solid var(--line);border-top:1px solid var(--line);grid-template-columns:minmax(0,1fr)}
@media (min-width:700px){.plib{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1200px){.plib{grid-template-columns:repeat(3,minmax(0,1fr))}}
.plib>li{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:10px;background:var(--ink)}
.plib .pl-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.plib h3{margin:0;font:500 17px/1.2 var(--display);font-stretch:87.5%;letter-spacing:-.02em;color:var(--paper)}
.plib p{margin:0;font-size:14px;line-height:1.5;color:var(--soft)}
.plib .pl-ft{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.added{color:var(--e,var(--paper))}

/* score */
.score-top{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);grid-template-columns:minmax(0,1fr)}
@media (min-width:1000px){.score-top{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}}
.score-top>*{background:var(--ink);padding:clamp(18px,2.2vw,28px);display:flex;flex-direction:column;gap:14px;min-width:0}
.score-big{font:900 clamp(96px,11vw,160px)/.8 var(--num);color:var(--paper);font-variant-numeric:tabular-nums}
.lvlbar{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.lvlbar span{height:6px;background:var(--line-2)}
.lvlbar span.on{background:var(--paper)}
.lvlbar-l{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.lvlbar-l span{font:400 9px/1.3 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--dim-2)}
.areas{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.areas li{display:grid;grid-template-columns:minmax(0,10rem) minmax(0,1fr) minmax(0,9.5rem);gap:14px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.areas li:last-child{border-bottom:0}
.ar-n{font:500 15px/1.2 var(--display);font-stretch:87.5%;color:var(--paper)}
.ar-bar{height:8px;background:var(--ink-2);border:1px solid var(--line-2);position:relative;overflow:hidden}
.ar-bar i{position:absolute;inset:0 auto 0 0;background:var(--e,var(--paper))}
.ar-l{font:400 10px/1.3 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);text-align:right}
@media (max-width:640px){.areas li{grid-template-columns:minmax(0,1fr) auto;gap:8px 12px}.ar-bar{grid-column:1/-1;grid-row:2}}
.next-l{list-style:none;margin:0;padding:0}
.next-l li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.next-l li:last-child{border-bottom:0}
.next-l b{font:500 15px/1.2 var(--display);font-stretch:87.5%;color:var(--paper)}
.next-l p{margin:4px 0 0;font-size:14px;color:var(--soft)}
.note{font:400 11px/1.5 var(--display);letter-spacing:.04em;color:var(--dim-2)}

/* wizard */
.conn{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);grid-template-columns:minmax(0,1fr)}
@media (min-width:700px){.conn{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1100px){.conn{grid-template-columns:repeat(3,minmax(0,1fr))}}
.conn>div{background:var(--ink);padding:14px 16px;display:flex;align-items:center;gap:12px}
.conn .cn-ic{width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--line-2);font:500 12px/1 var(--display);color:var(--paper);flex:none}
.conn .cn-n{flex:1;min-width:0;font-size:14px;color:var(--paper)}
.conn .cn-s{font:400 10px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--dim-2)}
.conn .on .cn-s{color:var(--agents)}
.rules{border-top:1px solid var(--line)}
.rule{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.rule .r-t{flex:1;min-width:0}
.rule .r-t b{display:block;font-weight:500;color:var(--paper);font-size:15px}
.rule .r-t span{font-size:13px;color:var(--dim)}
.rule .inp{width:110px;padding:8px 10px;font-size:14px}

/* drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);z-index:80;background:var(--ink);border-left:1px solid var(--line-2);display:flex;flex-direction:column;transform:translateX(102%);transition:transform .25s var(--wipe);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.open{transform:none}
.drawer-scrim{position:fixed;inset:0;z-index:75;background:rgba(7,7,8,.6)}
.dr-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dr-bd{padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.dr-t{margin:0;font-family:var(--display);font-weight:500;font-stretch:87.5%;font-size:28px;letter-spacing:-.045em;color:var(--paper)}
.kv{margin:0;display:grid;grid-template-columns:110px minmax(0,1fr);border-top:1px solid var(--line)}
.kv dt,.kv dd{margin:0;padding:10px 0;border-bottom:1px solid var(--line)}
.kv dt{font:400 10px/1.6 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.kv dd{color:var(--paper);font-size:14px}
.tl{list-style:none;margin:0;padding:0;border-left:1px solid var(--line-2);margin-left:4px}
.tl li{position:relative;padding:0 0 14px 16px;font-size:14px;color:var(--soft)}
.tl li::before{content:"";position:absolute;left:-4px;top:6px;width:7px;height:7px;background:var(--e,var(--paper))}
.tl li span{display:block;font:400 10px/1.4 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--dim-2)}

/* settings */
.stabs{margin-bottom:-1px}
.set-card{border:1px solid var(--line);padding:clamp(18px,2.2vw,28px);display:flex;flex-direction:column;gap:18px}
.set-card h2{margin:0;font:500 18px/1.2 var(--display);font-stretch:87.5%;color:var(--paper)}
.invite{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.invite .inp{flex:1 1 200px;width:auto;padding:10px 12px;font-size:14px}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:var(--paper);color:var(--ink);font:400 12px/1.4 var(--display);letter-spacing:.04em;padding:12px 16px;max-width:calc(100vw - 32px);display:flex;gap:10px;align-items:center;animation:rise .25s ease-out both}
.toast::before{content:"[ok]";font-weight:500}
.mainc{min-width:0;display:flex;flex-direction:column}
.ck-box{appearance:none;-webkit-appearance:none;width:16px;height:16px;flex:none;border:1px solid var(--line-2);background:var(--ink);margin:0;display:grid;place-items:center;cursor:pointer}
.ck-box:checked{background:var(--e,var(--paper));border-color:var(--e,var(--paper))}
.ck-box:checked::after{content:"";width:6px;height:6px;background:var(--ink)}
.ck-box:focus-visible{outline:2px solid var(--paper);outline-offset:3px}
label.rule{cursor:pointer}
.app .eng-triad{margin:0;font:500 11px/1.4 var(--display);letter-spacing:.14em;text-transform:uppercase}

/* automation walkthrough */
.plib>li{position:relative}
.pl-open,.pt-open{appearance:none;-webkit-appearance:none;background:none;border:0;border-radius:0;padding:0;margin:0;font:inherit;color:inherit;letter-spacing:inherit;text-align:left;cursor:pointer}
.pl-open::after{content:"";position:absolute;inset:0;z-index:1}
.pl-open:focus{outline:none}
.pl-open:focus-visible::after{outline:2px solid var(--e,var(--paper));outline-offset:-2px}
.plib .pl-ft{position:relative;z-index:2}
.plib>li:hover{background:var(--ink-2)}
.plib>li:hover h3{color:var(--e,var(--paper))}
.pl-how{color:var(--dim)}
.plib>li:hover .pl-how{color:var(--e,var(--paper))}
.pt-open{text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:4px}
.pt-open:hover,.pt-open:focus-visible{color:var(--e,var(--paper));text-decoration-color:currentColor;outline:none}
.job-run{border:1px solid var(--line-2);background:var(--ink-2)}
.job-hd{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line-2)}
.job-ex{margin:0;padding:12px 14px 4px;font:400 12px/1.5 var(--display);color:var(--paper)}
.job-ex span{color:var(--dim-2)}
.job-run .feed{padding:4px 14px 6px}
.job-run .row{grid-template-columns:62px 72px minmax(0,1fr) auto}
.job-run .row .ac:not([class*="e-"]):not(.need):not(.me){color:var(--soft)}
.job-run.still .row{animation:none}
.job-sum{margin:0;padding:10px 14px;border-top:1px dashed var(--line-2);color:var(--dim)}
.job-kv dt{color:var(--e,var(--dim))}
@media (max-width:759px){
  .job-run .row{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"ac ts res" "msg msg msg"}
  .job-run .row .ts{display:block;grid-area:ts}
}
.dr-bd .pl-top{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap}
.job-kv{grid-template-columns:minmax(0,1fr)}
.job-kv dt{border-bottom:0;padding-bottom:2px}
.job-kv dd{padding-top:0;font-size:15px;line-height:1.5}

/* ================= live simulation ================= */
function tick(){
  if(!S||!S.live||document.hidden)return;
  const active=S.licensed.filter(e=>S.running[e]);if(!active.length)return;
  const s=setup(),pool=s.demo.feed.filter(f=>active.includes(f[0].slice(1)));if(!pool.length)return;
  S.tick=(S.tick||0)+1;
  const [a,m,r]=pool[Math.floor(Math.random()*pool.length)];
  const plays=S.plays.filter(p=>p.e===a.slice(1)&&p.added&&p.on);
  if(plays.length){const p=plays[Math.floor(Math.random()*plays.length)];p.runs++;p.last='just now';}
  pushLog(a,m,r);
  if(S.tick%5===0&&S.approvals.length<6&&has('agents')&&S.running.agents){
    const l=S.leads[Math.floor(Math.random()*S.leads.length)];
    S.approvals.unshift({id:nid(),e:'agents',kind:'Reply to a lead',to:l.n,why:'First message to a new contact',age:'just now',draft:`Hi ${first(l.n)}, thanks for getting in touch with ${S.biz}. Happy to help. Do you have 15 minutes this week? Here are a few times that work: Tuesday 10:00, Wednesday 2:30 or Thursday 9:00.\n\n${first(owner())}, ${S.biz}`});
    pushLog('@agents','drafted a reply to '+l.n,'waiting on you');
    if(route==='approvals'){const L=$('#ap-list');if(L)L.innerHTML=apList();else render(true);}
    if(route==='overview'&&!(document.activeElement||document.body).closest('#view input,#view textarea,#view select'))render(true);
  }
  save();
}

    if(el.tagName==='LABEL')return;
    if(el.tagName==='A'&&el.getAttribute('href')&&el.dataset.act!=='ap-go'&&el.dataset.act!=='act-pre')e.preventDefault();
    ACT[el.dataset.act](el,e);
  });

  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){if($('#drawer-root').firstChild)closeDrawer();$('.app').classList.remove('side-open');const m=$('#ws-menu');if(m&&!m.hidden)m.hidden=true;}
    if((e.key==='Enter'||e.key===' ')&&e.target.matches('tr.click')){e.preventDefault();ACT[e.target.dataset.act](e.target);}
  });
  window.addEventListener('hashchange',onRoute);
  const clk=()=>{const el=$('#clk');if(el){const d=new Date();el.textContent=pad2(d.getHours())+':'+pad2(d.getMinutes());}};clk();setInterval(clk,10000);
  setInterval(tick,6500);
  onRoute();
}
boot();
})();
</script>
</body>
